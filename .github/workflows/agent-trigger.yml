name: Agent Trigger

# Tahap PELAKSANAAN. Perencanaan sudah dipisah ke agent-plan.yml supaya kedua
# tahap bisa memakai model berbeda: perencana memakai model kuat, pelaksana
# memakai model murah yang hanya menerjemahkan rencana rinci menjadi kode.
#
# Alur: label 'plan-approved' -> branch feat/acsm-issue-N -> lint -> sim -> PR
#       label 'fast-track'    -> sama, tetapi tanpa rencana (untuk issue kecil)
#
# Label 'agent-task' TIDAK lagi ditangani di sini; itu milik agent-plan.yml.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Nomor issue yang akan diimplementasikan'
        required: true
        type: string
  issues:
    types: [labeled]

# Batasi agen serentak untuk menghindari rate limit
concurrency:
  group: agent-queue-${{ github.event.issue.number || github.event.inputs.issue_number }}

jobs:
  agent:
    # Trigger hanya untuk 3 label yang relevan (atau manual dispatch).
    # Label lain di-ignore supaya job tidak jalan sia-sia.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'plan-approved' ||
      github.event.label.name == 'fast-track'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Determine Issue Number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.issue_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi
      - name: Setup HDL toolchain (Verilator / Icarus / GHDL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator iverilog
          # ghdl ada di repo 'universe' — jangan gagalkan job kalau paketnya tidak tersedia
          sudo apt-get install -y --no-install-recommends ghdl \
            || echo "::warning::ghdl tidak tersedia di runner ini — pengecekan VHDL akan dilewati"
          echo "--- versi toolchain ---"
          verilator --version || true
          iverilog -V 2>/dev/null | head -1 || true
          ghdl --version 2>/dev/null | head -1 || true

      # Wait random 0-120 seconds to stagger concurrent agents and avoid rate limits
      - name: Stagger Start (avoid rate limit)
        run: |
          WAIT=$((RANDOM % 120))
          echo "Waiting ${WAIT}s to stagger API calls..."
          sleep $WAIT

      # TAHAP 2: IMPLEMENT — jalan saat label 'plan-approved' (rencana
      # sudah di-review human) atau 'fast-track' (bypass, issue kecil).
      # Alur: branch feat/acsm-issue-N -> implement -> lint/elaborate -> PR.
      # ============================================================

      # Preflight check: plan-approved label WAJIB punya komentar <!-- agent-plan -->.
      # Mencegah skenario label dipasang manual atau komentar rencana terhapus —
      # tanpa gate ini, prompt implement diam-diam jatuh ke mode issue-body-only
      # (perilaku fast-track), yang mementahkan human-in-the-loop plan approval.
      - name: Preflight — Plan Comment Must Exist (plan-approved trigger)
        if: github.event.label.name == 'plan-approved'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE_NUM="${{ steps.issue.outputs.number }}"
          PLAN_COUNT=$(gh issue view "$ISSUE_NUM" --json comments \
            --jq '[.comments[] | select(.body | contains("<!-- agent-plan -->"))] | length')
          if [ "$PLAN_COUNT" -eq 0 ]; then
            echo "::error::Triggered by plan-approved label but NO <!-- agent-plan --> comment found on issue #$ISSUE_NUM."
            echo "::error::A plan must be posted and approved before implementation can start."
            echo "::error::To create a plan, apply the 'agent-task' label first, then 'plan-approved' after reviewing the plan."
            echo "::error::If this is a small change that does not need a plan, use the 'fast-track' label instead."
            exit 1
          fi
          echo "✅ Plan comment with <!-- agent-plan --> marker found — proceeding with implementation"

      # Preflight: pastikan gateway model hidup dan kredensialnya diterima SEBELUM
      # menghabiskan menit demi menit. Kegagalan tingkat koneksi (DNS mati, koneksi
      # ditolak) dianggap fatal karena pasti menggagalkan agent. Kode HTTP hanya
      # berupa peringatan: bentuk path yang dipakai CLI bisa berbeda dari yang
      # dicoba di sini, jadi 401/404 tidak boleh memblokir alur yang sebenarnya jalan.
      - name: Preflight gateway model
        env:
          PF_BASE_URL: ${{ vars.CODE_BASE_URL || 'https://rhkb7em.abc-tunnel.us/v1' }}
          PF_TOKEN: ${{ secrets.CODE_API_KEY || secrets.AGENT_API_KEY }}
          PF_MODEL: ${{ vars.CODE_MODEL || 'agent-coding' }}
        run: |
          echo "Gateway : $PF_BASE_URL"
          echo "Model   : $PF_MODEL"
          set +e
          HTTP=$(curl -sS -o /tmp/preflight.json -w "%{http_code}" --max-time 30 \
            -X POST "${PF_BASE_URL%/}/messages" \
            -H "x-api-key: $PF_TOKEN" \
            -H "authorization: Bearer $PF_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d "{\"model\":\"$PF_MODEL\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}")
          CURL_RC=$?
          set -e
          if [ $CURL_RC -ne 0 ]; then
            echo "::error::Gateway tidak dapat dihubungi (curl rc=$CURL_RC). Agent pasti gagal, dihentikan sekarang."
            exit 1
          fi
          echo "HTTP $HTTP"
          case "$HTTP" in
            200|201) echo "Gateway sehat dan model '$PF_MODEL' dikenali." ;;
            400)     echo "::warning::HTTP 400 — payload preflight mungkin tak cocok, atau nama model '$PF_MODEL' tidak dikenali. Lanjut, tetapi ini tersangka utama bila agent gagal."
                     head -c 400 /tmp/preflight.json || true ;;
            401|403) echo "::warning::HTTP $HTTP — kredensial ditolak pada path preflight. Lanjut, tetapi periksa API key bila agent gagal." ;;
            404)     echo "::warning::HTTP 404 — path preflight berbeda dari yang dipakai CLI. Ini normal untuk sebagian gateway; diabaikan." ;;
            *)       echo "::warning::HTTP $HTTP tak terduga."
                     head -c 400 /tmp/preflight.json || true ;;
          esac

      - name: Run Claude Code Agent (Implement)
        id: claude
        env:
          ANTHROPIC_BASE_URL: ${{ vars.CODE_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.CODE_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.CODE_MODEL }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ vars.CODE_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Batas waktu satu percobaan. Tanpa ini, panggilan yang MENGGANTUNG
          # membuat job diam sampai batas job dan loop retry di bawah tidak
          # pernah terpakai sama sekali. 3 x 780s + backoff 180s = 42 menit, muat di timeout-minutes 45.
          AGENT_TIMEOUT=780
          RAW_LOG=$RUNNER_TEMP/agent-stream.jsonl
          # pipefail supaya status `claude` yang menentukan, bukan `tee`.
          set -o pipefail
          MAX_RETRIES=3
          RETRY=0

          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo "=== Attempt $((RETRY+1)) of $MAX_RETRIES (IMPLEMENT stage) ==="

            if timeout "$AGENT_TIMEOUT" claude -p "Read GitHub issue #${{ steps.issue.outputs.number }} using 'gh issue view ${{ steps.issue.outputs.number }}'.

          ## Approved plan (WAJIB dibaca dulu)

          Check the issue comments for the LATEST comment starting with the marker
          '<!-- agent-plan -->' using:
            gh issue view ${{ steps.issue.outputs.number }} --comments
          That comment is the implementation plan a human has reviewed and approved.
          FOLLOW that plan (files, module hierarchy, port map, FSM, verification plan).
          If you must deviate from the plan for a good technical reason, you MUST explain
          the deviation and its reason in a 'Deviations from plan' section in the PR body.
          If no such comment exists, READ THE ISSUE LABELS: only proceed without a plan
          if the issue has the 'fast-track' label. For any other scenario (including
          'plan-approved' with no plan comment), stop and exit — do NOT implement
          without an approved plan.

          Create a feature branch from main named 'feat/acsm-issue-${{ steps.issue.outputs.number }}'.

          This repository is a hardware design project in VHDL, Verilog and SystemVerilog.
          Implement the requested change following the existing patterns in this repo:
          naming style, file layout, package/library usage, filelist or build script,
          and the reset/clock strategy already used by neighbouring modules.
          Read CLAUDE.md first if it exists — it holds the project's HDL conventions and
          takes priority over your defaults. Reference docs/architecture.md if present.

          ## Aturan RTL WAJIB (HDL guardrails)

          Melanggar aturan berikut menghasilkan bug hardware yang sering lolos dari
          simulasi fungsional dasar tapi gagal saat sintesis atau di silikon.
          Jangan menebak — kalau ragu, ikuti pola modul yang sudah ada di repo ini.

            1. SystemVerilog: gunakan always_ff / always_comb / always_latch untuk RTL baru.
               JANGAN pakai bare 'always' atau 'always @(*)' untuk logika sintesis baru.
            2. Blok sekuensial pakai non-blocking assignment (<=); blok kombinasional
               pakai blocking (=). Jangan campur keduanya di dalam satu blok.
            3. Hindari latch tak sengaja: di always_comb, beri nilai default untuk SETIAP
               sinyal output di awal blok, atau pastikan if/case-nya lengkap (ada else /
               ada default). Ini penyebab bug paling sering di RTL yang ditulis agent.
            4. Setiap 'case' harus punya cabang 'default'. Pakai unique/priority hanya
               kalau memang benar-benar dijamin oleh desain — kalau ragu, jangan.
            5. Reset: ikuti strategi reset yang sudah dipakai modul tetangga (sinkron vs
               asinkron, active-low vs active-high). Jangan mencampur gaya reset dalam
               satu clock domain.
            6. Clock domain crossing: setiap sinyal yang menyeberang clock domain WAJIB
               lewat sinkronisator — 2-flop synchronizer untuk single-bit, handshake atau
               async FIFO untuk bus/multi-bit. Jangan pernah sampling langsung antar domain.
            7. Jangan pakai konstruksi non-sintesis di dalam RTL: delay (#), blok 'initial',
               \$display, \$finish, tipe 'real', fork/join. Itu hanya boleh di testbench.
            8. VHDL: pakai ieee.numeric_std (signed/unsigned). JANGAN pakai std_logic_arith,
               std_logic_unsigned, atau std_logic_signed. Port pakai std_logic /
               std_logic_vector.
            9. Perhatikan lebar bit — hindari truncation atau extension implisit.
               Lakukan resize/cast secara eksplisit.
           10. Setiap modul RTL baru harus punya testbench minimal yang benar-benar bisa
               dijalankan (bukan sekadar lolos kompilasi), dan testbench itu harus punya
               self-check (assertion atau perbandingan terhadap nilai harapan) — bukan
               cuma waveform dump.
           11. Kalau repo punya filelist (.f), Makefile, FuseSoC .core, atau project file
               vendor, DAFTARKAN setiap file baru di situ. Modul yang tidak terdaftar
               tidak ikut terbangun dan bug-nya baru ketahuan jauh di belakang.

          ## Verifikasi sebelum bikin PR (WAJIB)

          Jalankan lint/elaborate sesuai bahasa file yang kamu sentuh. Kalau repo sudah
          punya Makefile, script, filelist (.f), atau FuseSoC core — PAKAI itu lebih dulu.
          Fallback kalau repo belum punya build system:

            - Verilog / SystemVerilog:
                verilator --lint-only -Wall <top/file>
                iverilog -g2012 -o /tmp/sim <files> && vvp /tmp/sim
            - VHDL:
                ghdl -s <file>                    (syntax check)
                ghdl -a <file>                    (analyze)
                ghdl -e <top> && ghdl -r <top>    (elaborate + run testbench)

          Toolchain verilator, iverilog dan ghdl sudah terpasang di runner ini.
          JANGAN membuat PR kalau lint masih error atau testbench masih gagal.
          Laporkan output lint/simulasi yang sebenarnya di PR body — jangan mengarang hasil.

          Then create a PR targeting main using:
            gh pr create --title '<conventional commit title>' \
              --label 'agent-generated' \
              --body '<PR body with: Summary, daftar modul yang ditambah/diubah beserta tabel port, hasil lint/elaborate yang sebenarnya, hasil testbench, Test plan, Deviations from plan (if any)>'

          DO NOT enable auto-merge. Let the automated reviewers run first; the human will
          merge manually after review passes.

          Post the PR URL as a comment on issue #${{ steps.issue.outputs.number }}." \
              --dangerously-skip-permissions \
              --output-format stream-json --verbose 2>&1 \
              | tee "$RAW_LOG"; then
              CLAUDE_EXIT=0
            else
              CLAUDE_EXIT=$?
            fi

            # Ringkasan tool call dari stream. Sengaja dijalankan SETELAH exit code
            # ditangkap, dan dibungkus `|| true`, supaya tidak bisa mengubah status.
            if [ -s "$RAW_LOG" ]; then
              echo "--- tool call yang dipakai agent ---"
              jq -Rr 'fromjson? | select(.type=="assistant") | (.message.content // [])[] | select(.type=="tool_use") | .name' \
                "$RAW_LOG" 2>/dev/null | sort | uniq -c | sort -rn | head -20 || true
            fi

            if [ $CLAUDE_EXIT -eq 124 ]; then
              echo "::warning::Agent menggantung dan dihentikan paksa setelah ${AGENT_TIMEOUT}s. Tanpa pembungkus timeout ini, job akan diam sampai batas job dan loop retry tidak pernah terpakai."
            fi

            if [ $CLAUDE_EXIT -ne 0 ]; then
              RETRY=$((RETRY+1))
              if [ $RETRY -lt $MAX_RETRIES ]; then
                BACKOFF=$((60 * RETRY))
                echo "Claude Code failed with exit code $CLAUDE_EXIT (likely rate limit). Retrying in ${BACKOFF}s..."
                sleep $BACKOFF
                continue
              else
                echo "Claude Code failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi

            # Exit 0 — verify artifacts exist (false-success detection)
            echo "Claude Code exited 0 — verifying artifacts..."

            ISSUE_NUM="${{ steps.issue.outputs.number }}"
            BRANCH="feat/acsm-issue-${ISSUE_NUM}"
            VERIFICATION_FAILED=false

            # Check 1: branch pushed to remote
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              echo "✅ Branch '$BRANCH' exists on remote"
              echo "branch_exists=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Branch '$BRANCH' NOT found on remote"
              echo "branch_exists=false" >> $GITHUB_OUTPUT
              VERIFICATION_FAILED=true
            fi

            # Check 2: PR opened pointing to that branch
            PR_COUNT=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
            echo "pr_count=${PR_COUNT}" >> $GITHUB_OUTPUT
            if [ "$PR_COUNT" -ge 1 ]; then
              PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
              echo "✅ PR opened: $PR_URL"
            else
              echo "❌ No PR found for branch '$BRANCH'"
              VERIFICATION_FAILED=true
            fi

            # Check 3: agent left a comment on the issue
            COMMENT_COUNT=$(gh issue view "$ISSUE_NUM" --json comments --jq '[.comments[] | select(.author.login == "github-actions[bot]" or .author.login == "hargithub-bot")] | length')
            echo "comment_count=${COMMENT_COUNT}" >> $GITHUB_OUTPUT
            if [ "$COMMENT_COUNT" -ge 1 ]; then
              echo "✅ Agent comment found on issue #$ISSUE_NUM"
            else
              echo "⚠️ No agent comment on issue #$ISSUE_NUM (may not be critical)"
            fi

            if [ "$VERIFICATION_FAILED" = true ]; then
              echo "::error::Agent exited 0 but verification failed — no branch/PR created. Likely silent failure (gateway timeout, empty response, or trust dialog issue)."
              RETRY=$((RETRY+1))
              if [ $RETRY -lt $MAX_RETRIES ]; then
                BACKOFF=$((60 * RETRY))
                echo "Retrying in ${BACKOFF}s due to verification failure..."
                sleep $BACKOFF
                continue
              else
                echo "Claude Code failed verification after $MAX_RETRIES attempts"
                exit 1
              fi
            fi

            # All checks passed
            echo "All verification checks passed"
            exit 0
          done

      - name: Write Job Summary (Implement)
        if: always()
        env:
          BRANCH_EXISTS: ${{ steps.claude.outputs.branch_exists }}
          PR_COUNT: ${{ steps.claude.outputs.pr_count }}
          COMMENT_COUNT: ${{ steps.claude.outputs.comment_count }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE_NUM="${{ steps.issue.outputs.number }}"
          BRANCH="feat/acsm-issue-${ISSUE_NUM}"
          PR_URL=""

          if [ "${PR_COUNT:-0}" -ge 1 ]; then
            PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url' 2>/dev/null || echo "")
          fi

          {
            echo "## Agent Verification (Implement stage)"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Branch \`$BRANCH\` | $([ "$BRANCH_EXISTS" = "true" ] && echo "✅ Exists" || echo "❌ Not found") |"
            echo "| Pull Request | $([ "${PR_COUNT:-0}" -ge 1 ] && echo "✅ [$PR_COUNT open]($PR_URL)" || echo "❌ None") |"
            echo "| Issue Comment | $([ "${COMMENT_COUNT:-0}" -ge 1 ] && echo "✅ Posted" || echo "⚠️ Not found") |"
            echo ""
            if [ "${PR_COUNT:-0}" -ge 1 ] && [ -n "$PR_URL" ]; then
              echo "**PR URL:** $PR_URL"
            fi
          } >> $GITHUB_STEP_SUMMARY
